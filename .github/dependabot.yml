version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    # Only open PRs for minor and patch updates — major bumps require manual review
    versioning-strategy: increase-if-necessary
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Never auto-bump major versions — they require manual migration
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
